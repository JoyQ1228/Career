function renderTracker(){const all=Object.entries(state.records),n=all.filter(([id,r])=>due(r)).length;$('tracker-notice').innerHTML=`<span>共 ${all.length} 个岗位 · 实习 ${all.filter(([id])=>jobs.find(j=>j.id==id)?.type==='实习').length} · 校招 ${all.filter(([id])=>jobs.find(j=>j.id==id)?.type==='校招').length}</span><button class="${onlyDue?'selected':''}" aria-pressed="${onlyDue}" onclick="onlyDue=!onlyDue;renderTracker()">到期行动 ${n}${onlyDue?' · 取消筛选':''}</button>`;$('status-tabs').innerHTML=['全部',...stages].map(s=>`<button class="${filter===s?'selected':''}" onclick="filter='${s}';renderTracker()">${s} ${all.filter(([id,r])=>s==='全部'||r.status===s).length}</button>`).join('');const list=all.filter(([id,r])=>(filter==='全部'||r.status===filter)&&(!onlyDue||due(r)));$('track-list').innerHTML=list.length?list.map(([id,r])=>{const j=jobs.find(j=>j.id==id),a=assessment(id);return `<article class="job"><div class="job-top">${logo(j)}<div><button class="job-title" onclick="openJob(${id})">${typeBadge(j)}${j.title}</button><div class="company">${j.company} · ${j.city}</div></div><span class="status">${r.status}</span></div><div class="count-row">${r.applied?'投递日期：'+esc(r.applyDate||'未记录'):`条件自查 ${a.complete?'已完成':'未完成'} · 材料 ${a.prepared} / 2`}</div>${isClosed(r)?`<div class="result-line">结束原因：${esc(r.reason)}${r.closedDate?`<br>结束日期：${esc(r.closedDate)}`:''}</div>`:r.action?`<div class="due"><div class="${r.done?'done':''}">${r.done?'已完成':'下一步'}：${esc(r.action)}</div><div class="${!r.done&&r.date&&r.date<today()?'overdue':'muted'}">${esc(r.date||'未设置日期')}${!r.done&&r.date?(r.date<today()?' · 逾期':r.date===today()?' · 今天':''):''}</div><div class="action-row" style="padding-top:8px"><button class="link" onclick="editAction(${id})">${r.done?'安排下一步':'修改待办'}</button>${!r.done?`<button class="link" onclick="finishAction(${id})">标记完成</button>`:''}</div></div>`:`<div class="next-empty">尚未安排下一步 <button class="link" onclick="editAction(${id})">添加待办</button></div>`}${r.notes?`<div class="count-row">备注：${esc(r.notes)}</div>`:''}<div class="action-row">${recordActions(id,r)}</div><div class="job-foot"><button class="link timeline-link" style="margin:0" onclick="showHistory(${id})">操作记录 / 撤销</button><button class="link" onclick="editNotes(${id})">备注</button><button class="link" onclick="removeRecord(${id})">移除</button></div></article>`}).join(''):`<div class="empty" style="grid-column:1/-1"><h3>${all.length?'没有符合筛选条件的记录':'尚未添加岗位'}</h3>${all.length?`<button class="secondary" onclick="filter='全部';onlyDue=false;renderTracker()">查看全部</button>`:`<p>在岗位列表中选择岗位，开始申请准备。</p><button class="primary" onclick="navigate('discover')">浏览岗位</button>`}</div>`}
function progressDialog(id,type){const r=state.records[id];activeJob=id;const title={面试:'记录笔试 / 面试',录用:'记录录用结果',结束:'结束申请',入职:'确认已入职'}[type];const body=type==='面试'?`<label class="field">环节名称<input id="event-name" required maxlength="100" value="${r.status==='笔试 / 面试'?'下一轮面试':'第一轮面试'}" placeholder="例如：在线笔试、第二轮面试"></label><div class="date-grid"><label class="field">日期<input id="event-date" required type="date" min="${r.applyDate||''}" value="${plusDays(1)}"></label><label class="field">时间<input id="event-time" required type="time" value="14:00"></label></div><label class="field">地点 / 方式（可选）<input id="event-place" maxlength="150" placeholder="例如：线上会议、办公地点"></label>`:type==='录用'?`<label class="field">收到录用日期<input id="event-date" type="date" required min="${r.applyDate||''}" max="${today()}" value="${today()}"></label><label class="field">回复录用截止日期<input id="reply-date" type="date" required min="${today()}" value="${plusDays(3)}"></label>`:type==='入职'?`<label class="field">实际入职日期<input id="event-date" type="date" required min="${r.offerDate||r.applyDate||''}" max="${today()}" value="${today()}"></label><p class="form-note">确认后结束该申请，不再计入待办。</p>`:`<label class="field">结束原因<select id="end-reason" required>${['主动放弃','未通过筛选','未通过笔试 / 面试','岗位停止招聘','未接受录用','其他'].map(v=>`<option>${v}</option>`).join('')}</select></label><label class="field">结束日期<input id="event-date" type="date" required min="${r.applyDate||''}" max="${today()}" value="${today()}"></label><p class="form-note">结束后保留记录，并清除未完成的待办。</p>`;showModal(head(title)+`<form onsubmit="event.preventDefault();saveProgress(${id},'${type}')"><div class="dialog-body">${body}<label class="field">补充说明${type==='结束'?'（其他原因时必填）':'（可选）'}<textarea id="event-note" maxlength="500"></textarea></label><p class="error" id="form-error" role="alert"></p></div><div class="dialog-foot"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">保存记录</button></div></form>`)}
function saveProgress(id,type){const r=state.records[id],date=$('event-date').value,note=$('event-note').value.trim();let patch={},label='';if(type==='面试'){const name=$('event-name').value.trim(),time=$('event-time').value,place=$('event-place').value.trim();if(!name){$('form-error').textContent='请填写环节名称。';return}label=`安排${name} · ${date} ${time}${place?' · '+place:''}`;patch={status:'笔试 / 面试',action:`参加${name} · ${time}${place?' · '+place:''}`,date,done:false}}
  if(type==='录用'){const reply=$('reply-date').value;if(reply<date){$('form-error').textContent='回复截止日期不能早于收到录用日期。';return}label='收到录用';patch={status:'已录用',offerDate:date,action:'确认录用条件并回复企业',date:reply,done:false}}
  if(type==='结束'){const reason=$('end-reason').value;if(reason==='其他'&&!note){$('form-error').textContent='请补充具体结束原因。';return}label='结束申请：'+reason;patch={status:'已结束',reason:reason+(note?' · '+note:''),closedDate:date,action:'',date:'',done:false}}
  if(type==='入职'){label='确认已入职';patch={status:'已结束',reason:'已入职',closedDate:date,action:'',date:'',done:false}}
  if(note&&type!=='结束')label+=' · '+note;transition(id,label,patch);closeModal();filter='全部';onlyDue=false;renderTracker()}
function editAction(id){const r=state.records[id];showModal(head(r.done?'安排下一步':'编辑待办')+`<form onsubmit="event.preventDefault();saveAction(${id})"><div class="dialog-body"><label class="field">行动内容<input id="action-text" required maxlength="120" value="${r.done?'':esc(r.action)}" placeholder="例如：联系招聘负责人确认后续安排"></label><label class="field">计划日期<input id="action-date" type="date" required value="${r.done?plusDays(1):esc(r.date||today())}"></label><p class="form-note">仅在页面内显示待办，不发送站外提醒。</p><p class="error" id="form-error" role="alert"></p></div><div class="dialog-foot"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">保存待办</button></div></form>`)}
function saveAction(id){const action=$('action-text').value.trim();if(!action){$('form-error').textContent='请填写具体行动。';return}transition(id,'更新待办：'+action,{action,date:$('action-date').value,done:false});closeModal();renderTracker()}
function finishAction(id){const r=state.records[id];if(['待准备','待投递'].includes(r.status)){if(r.action==='完成岗位自查与申请材料'){openJob(id);return}if(r.action==='完成申请并确认投递'){applyDialog(id);return}}transition(id,'完成待办：'+r.action,{done:true});showModal(head('待办已完成')+`<div class="dialog-body"><p>${esc(r.action)}</p><p class="form-note">岗位仍处于「${r.status}」。你可以记录新的进展，或安排下一次跟进。</p><div class="action-row">${recordActions(id,r)}</div></div><div class="dialog-foot"><button class="secondary" onclick="closeModal()">暂不安排</button><button class="primary" onclick="editAction(${id})">安排下一步</button></div>`)}
function editNotes(id){showModal(head('投递备注')+`<form onsubmit="event.preventDefault();saveNotes(${id})"><div class="dialog-body"><label class="field">备注<textarea id="record-note" maxlength="500">${esc(state.records[id].notes)}</textarea></label></div><div class="dialog-foot"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">保存备注</button></div></form>`)}
function saveNotes(id){transition(id,'更新备注',{notes:$('record-note').value.trim()});closeModal()}
function showHistory(id){const r=state.records[id],last=r.history.at(-1);showModal(head('操作记录')+`<div class="dialog-body"><ol class="history">${[...r.history].reverse().map(h=>`<li>${esc(h.label)}<time>${esc(h.date)}</time></li>`).join('')}</ol>${last?.before?'<p class="form-note">撤销会恢复最近一次操作前的状态、待办和备注。</p>':''}</div><div class="dialog-foot">${last?.before?`<button class="secondary" onclick="undoLast(${id})">撤销最近一次操作</button>`:''}<button class="primary" onclick="closeModal()">关闭</button></div>`)}
function undoLast(id){const r=state.records[id],h=r.history.at(-1);if(!h?.before)return;const history=r.history.slice(0,-1);state.records[id]={...h.before,history};syncReady(id);commit('已撤销最近一次操作');showHistory(id)}
function removeRecord(id){showModal(head('移除投递记录')+`<div class="dialog-body"><p>移除该岗位的进度、待办及条件自查。</p></div><div class="dialog-foot"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="delete state.records[${id}];delete state.checks[${id}];closeModal();commit('记录已移除')">确认移除</button></div>`)}
$('modal').addEventListener('cancel',()=>{activeJob=0});
$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();navigate('discover')});
applyPrefs(false);navigate(location.hash.slice(1)||'discover',false);persist();

</script></body></html>
